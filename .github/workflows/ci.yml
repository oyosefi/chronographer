name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chronographer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chronographer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chronographer_test
      API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "src/app[dev]"
      - run: ruff check src/app/app src/app/tests scripts chronographer-skill/scripts
      - run: alembic -c src/app/alembic.ini upgrade head
        env:
          PYTHONPATH: src/app
      - run: pytest src/app/tests
      - run: python scripts/export_openapi.py --check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: src/app
          push: false
